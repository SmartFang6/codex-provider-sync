services:
  codex-session-sync:
    build: .
    container_name: codex-session-sync
    restart: unless-stopped
    environment:
      CODEX_SYNC_ADMIN_USER: admin
      CODEX_SYNC_ADMIN_PASSWORD: change-this-password
      CODEX_SYNC_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
